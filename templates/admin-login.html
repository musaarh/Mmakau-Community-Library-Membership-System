{% extends "base.html" %}


{% block title %}
Librarian Login | Mmakau Community Library
{% endblock %}


{% block content %}


<!-- =========================================
     LIBRARIAN LOGIN
========================================= -->

<section class="auth-section">

    <div class="auth-container">


        <!-- HEADING -->

        <div class="section-heading">

            <p class="section-label">
                LIBRARIAN ACCESS
            </p>

            <h1>
                Librarian Login
            </h1>

            <p>
                Sign in to securely manage library
                membership applications.
            </p>

        </div>



        <!-- LOGIN CARD -->

        <div class="auth-card">


            <form
                method="POST"
                action="{{ url_for('admin_login') }}"
            >


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- ERROR -->

                {% if error %}

                    <div class="form-error">

                        {{ error }}

                    </div>

                {% endif %}



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="primary-button"
                >
                    Log In
                </button>


            </form>


        </div>


    </div>

</section>


{% endblock %}
